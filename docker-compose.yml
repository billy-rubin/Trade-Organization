services:
  postgres:
    image: postgres:15-alpine
    container_name: trade-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_DSN=postgres://postgres:postgres@postgres:5432/trade_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: